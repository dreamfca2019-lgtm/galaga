<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전주 원데이 세미나 · 2027년 1월 OSR</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#c9d2e0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    display:flex; justify-content:center; padding:20px 10px;
  }
  .poster{
    width:210mm; height:297mm; background:#0b2447; color:#fff; position:relative; overflow:hidden;
    display:flex; flex-direction:column; box-shadow:0 8px 40px rgba(0,0,0,.35);
  }
  /* 배경 장식 */
  .glow1,.glow2,.ring,.dots{position:absolute; pointer-events:none;}
  .glow1{width:520px; height:520px; border-radius:50%; right:-160px; top:-150px;
    background:radial-gradient(circle, rgba(31,95,191,.85) 0%, rgba(31,95,191,0) 70%);}
  .glow2{width:460px; height:460px; border-radius:50%; left:-180px; bottom:-160px;
    background:radial-gradient(circle, rgba(214,158,46,.45) 0%, rgba(214,158,46,0) 70%);}
  .ring{width:300px; height:300px; border:2px solid rgba(157,192,238,.28); border-radius:50%; right:-60px; bottom:60px;}
  .ring.small{width:180px; height:180px; right:40px; bottom:120px; border-color:rgba(214,158,46,.28);}
  .dots{right:26mm; top:150mm; display:grid; grid-template-columns:repeat(4,7px); gap:9px; opacity:.45;}
  .dots span{width:7px; height:7px; border-radius:50%; background:#9dc0ee;}

  .top{position:relative; padding:20mm 18mm 0; z-index:2;}
  .badge{display:inline-block; border:1.5px solid #d69e2e; color:#f0c368; font-size:11pt;
    letter-spacing:6px; font-weight:800; padding:5px 16px; border-radius:2px;}
  .title{margin-top:9mm; font-size:40pt; font-weight:900; line-height:1.22; letter-spacing:-2px;}
  .title .gold{color:#f0c368;}
  .rule{width:26mm; height:4px; background:#d69e2e; margin:7mm 0 6mm;}
  .sub{font-size:15pt; color:#b9cfea; line-height:1.65; font-weight:600;}

  .when{position:relative; z-index:2; margin:auto 18mm 0; }
  .box{background:rgba(255,255,255,.07); border:1px solid rgba(157,192,238,.35);
    border-radius:6px; padding:9mm 10mm;}
  .row{display:flex; align-items:baseline; gap:7mm; padding:4.5mm 0; border-bottom:1px solid rgba(157,192,238,.2);}
  .row:last-child{border-bottom:0; padding-bottom:0;}
  .row:first-child{padding-top:0;}
  .lb{font-size:10pt; color:#8fb0d6; font-weight:800; letter-spacing:2px; width:16mm; flex:0 0 auto;}
  .val{font-size:17pt; font-weight:800; letter-spacing:-0.5px; line-height:1.4;}
  .val em{font-style:normal; color:#f0c368;}
  .val small{font-size:12pt; color:#b9cfea; font-weight:600; margin-left:4px;}

  .bottom{position:relative; z-index:2; padding:10mm 18mm 16mm;}
  .points{display:flex; gap:5mm; margin-bottom:9mm;}
  .pt{flex:1; border-top:2px solid #d69e2e; padding-top:4mm;}
  .pt b{display:block; font-size:11pt; color:#f0c368; margin-bottom:2mm; letter-spacing:-0.2px;}
  .pt span{font-size:10pt; color:#a9c2df; line-height:1.55; font-weight:600;}
  .contact{display:flex; justify-content:space-between; align-items:flex-end;
    border-top:1px solid rgba(157,192,238,.28); padding-top:7mm;}
  .contact .q{font-size:10pt; color:#8fb0d6; font-weight:700; letter-spacing:1px; margin-bottom:2mm;}
  .contact .name{font-size:13pt; color:#fff; font-weight:800;}
  .contact .blank{border-bottom:1px dotted rgba(157,192,238,.6); width:52mm; height:7mm;}

  @media print{
    body{background:#fff; padding:0;}
    .poster{box-shadow:none; width:210mm; height:297mm;}
    @page{size:A4 portrait; margin:0;}
  }
</style>
</head>
<body>
<div class="poster">
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="ring"></div>
  <div class="ring small"></div>
  <div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

  <div class="top">
    <div class="badge">MONTHLY OSR</div>
    <h1 class="title">전주<br><span class="gold">원데이 세미나</span></h1>
    <div class="rule"></div>
    <div class="sub">첫 30일을 오늘 시작합니다.<br>듣고 돌아가는 자리가 아니라,<br>오늘 손에 하나를 들고 나가는 자리.</div>
  </div>

  <div class="when">
    <div class="box">
      <div class="row">
        <div class="lb">일시</div>
        <div class="val">2027년 <em>1월 9일</em> 토요일 <small>오전 10시 30분</small></div>
      </div>
      <div class="row">
        <div class="lb">장소</div>
        <div class="val">전주 ABC</div>
      </div>
      <div class="row">
        <div class="lb">대상</div>
        <div class="val">신규 사업자 <small>선배 사업자 환영</small></div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="points">
      <div class="pt">
        <b>블라인드 체험</b>
        <span>이름 가린 제품을 직접 써 보고, 느낌을 한 단어로</span>
      </div>
      <div class="pt">
        <b>5분 실패담</b>
        <span>성공담 대신, 처음에 어디서 넘어졌는지</span>
      </div>
      <div class="pt">
        <b>첫 고객 역할극</b>
        <span>어색한 건 여기서 다 해 보고 가세요</span>
      </div>
    </div>
    <div class="contact">
      <div>
        <div class="q">문의</div>
        <div class="name">정승채</div>
      </div>
      <div>
        <div class="q">연락처</div>
        <div class="blank"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
