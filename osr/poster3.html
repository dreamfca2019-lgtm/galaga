<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FCA YOUNG 원데이 세미나 · 전주 ABC</title>
<style>
  @page{size:A4 portrait; margin:0;}
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:100%;}
  body{
    background:#fdf1f6; margin:0; padding:16px 8px;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    display:flex; justify-content:center; align-items:flex-start;
  }
  .stage{display:flex; justify-content:flex-start; align-items:flex-start; width:100%; overflow:hidden;}

  .poster{
    width:210mm; height:297mm; flex:0 0 auto; transform-origin:top left; position:relative;
    overflow:hidden; display:flex; padding:10mm;
    background:
      radial-gradient(75% 45% at 8% 0%, rgba(255,226,238,.9) 0%, rgba(255,226,238,0) 60%),
      radial-gradient(70% 45% at 100% 100%, rgba(255,235,243,.95) 0%, rgba(255,235,243,0) 62%),
      linear-gradient(170deg,#ffffff 0%,#fffafc 40%,#ffeef6 100%);
    box-shadow:0 10px 46px rgba(190,120,150,.16);
  }

  .flake{position:absolute; color:#ffffff; pointer-events:none;}
  .flake.f1{width:34mm; height:34mm; left:4mm; top:10mm; opacity:.9;}
  .flake.f2{width:20mm; height:20mm; left:24mm; top:52mm; opacity:.75; transform:rotate(18deg);}
  .flake.f3{width:26mm; height:26mm; left:7mm; bottom:30mm; opacity:.8; transform:rotate(-14deg);}
  .flake.f4{width:16mm; height:16mm; left:42mm; bottom:10mm; opacity:.65; transform:rotate(30deg);}
  .flake.f5{width:28mm; height:28mm; right:5mm; top:20mm; opacity:.85; transform:rotate(12deg);}
  .flake.f6{width:18mm; height:18mm; right:32mm; top:56mm; opacity:.7; transform:rotate(-22deg);}
  .flake.f7{width:30mm; height:30mm; right:8mm; bottom:26mm; opacity:.85; transform:rotate(-10deg);}
  .flake.f8{width:17mm; height:17mm; right:40mm; bottom:9mm; opacity:.65; transform:rotate(26deg);}

  .snow{position:absolute; inset:0; pointer-events:none;}
  .snow span{position:absolute; background:#fff; border-radius:50%; box-shadow:0 0 5px rgba(255,255,255,.95);}

  .frame{
    flex:1; border:0.35mm solid rgba(235,175,200,.6);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20mm 12mm; position:relative; text-align:center;
    background:rgba(255,255,255,.5);
  }
  .frame::before{
    content:""; position:absolute; inset:2.4mm; border:0.2mm solid rgba(235,175,200,.35); pointer-events:none;
  }

  .kicker{
    font-size:13pt; letter-spacing:8px; color:#d79ab7; font-weight:800; text-transform:uppercase;
    white-space:nowrap;
  }

  .title{margin-top:13mm; line-height:1.28; white-space:nowrap;}
  .title .en{
    display:block; font-family:Georgia,"Times New Roman",serif; font-weight:700;
    font-size:36pt; letter-spacing:4px; color:#d484a9;
  }
  .title .kr{
    display:block; margin-top:3mm; font-size:42pt; font-weight:900; letter-spacing:1px; color:#c05f8c;
  }

  .divider{width:80mm; height:0.4mm; margin:13mm 0;
    background:linear-gradient(90deg, rgba(235,175,200,0), rgba(235,175,200,1), rgba(235,175,200,0));}

  .info{white-space:nowrap;}
  .info .date{font-size:27pt; font-weight:900; letter-spacing:-0.8px; color:#b3567f;}
  .info .date span{color:#e07fa8;}
  .info .date small{display:block; margin-top:4mm; font-size:19pt; font-weight:800; color:#c98cab;}
  .info .place{margin-top:9mm; font-size:20pt; font-weight:800; color:#b86e91;}
  .info .addr{margin-top:4mm; font-size:13pt; font-weight:600; color:#cf9cb5;}

  .slogan{
    position:absolute; left:0; right:0; bottom:11mm; text-align:center;
    font-family:Georgia,"Times New Roman",serif; font-style:italic; font-size:14pt;
    color:#d484a9; letter-spacing:.4px; white-space:nowrap;
  }

  @media print{
    body{background:#fff; padding:0; display:block;}
    .stage{display:block; overflow:visible;}
    .poster{box-shadow:none; transform:none !important; margin:0;}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
</style>
</head>
<body>
<div class="stage">
<div class="poster" id="poster">

    <path d="M10 27 90 73"/><path d="M10 27l1 15M10 27l15-2"/><path d="M90 73l-1-15M90 73l-15 2"/>

    <path d="M90 27 10 73"/><path d="M90 27l-1 15M90 27l-15-2"/><path d="M10 73l1-15M10 73l15 2"/>
  </svg>

    <path d="M90 27 10 73"/><path d="M90 27l-1 15M90 27l-15-2"/><path d="M10 73l1-15M10 73l15 2"/>
  </svg>
  <svg class="flake f8" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round">
    <path d="M50 4V96"/><path d="M50 4 39 15M50 4l11 11"/><path d="M50 96 39 85M50 96l11-11"/>
    <path d="M10 27 90 73"/><path d="M10 27l1 15M10 27l15-2"/><path d="M90 73l-1-15M90 73l-15 2"/>
    <path d="M90 27 10 73"/><path d="M90 27l-1 15M90 27l-15-2"/><path d="M10 73l1-15M10 73l15 2"/>
  </svg>

  <div class="frame">

    <div class="kicker">2027 January</div>

    <h1 class="title">
      <span class="en">FCA YOUNG</span>
      <span class="kr">원데이 세미나</span>
    </h1>

    <div class="divider"></div>

    <div class="info">
      <div class="date">2027년 <span>1월 9일</span> 토요일<small>오전 10시 30분</small></div>
      <div class="place">전주 ABC 암웨이 매장</div>
      <div class="addr">전북 전주시 덕진구 세병2길 10 · 로마네시티 5차 6층</div>

    <div class="slogan">Helping People Live Better Lives</div>

  </div>
</div>
</div>
<script>
  (function(){
    var box = document.getElementById("snow");
    for(var i=0;i<70;i++){
      var s = document.createElement("span");
      var d = (Math.random()*3.6 + 1.6).toFixed(1);
      s.style.width = d + "px"; s.style.height = d + "px";
      s.style.left = (Math.random()*100).toFixed(2) + "%";
      s.style.top = (Math.random()*100).toFixed(2) + "%";
      s.style.opacity = (Math.random()*0.6 + 0.4).toFixed(2);
      box.appendChild(s);
    }
  })();

  function fit(){
    var p = document.getElementById("poster");
    if(!p) return;
    var stage = p.parentNode;
    p.style.transform = "none";
    stage.style.height = "auto";
    var w = p.offsetWidth, h = p.offsetHeight;
    var avail = Math.min(window.innerWidth - 16, w);
    var s = Math.min(1, avail / w);
    if(s < 1){
      p.style.transform = "scale(" + s + ")";
      stage.style.height = (h * s) + "px";
    }
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function(){ setTimeout(fit, 150); });
  window.addEventListener("load", fit);
  fit();
  setTimeout(fit, 80);
</script>
</body>
