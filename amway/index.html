<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>암웨이 제품 설명 자료</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --line:#e3e7ef; --text:#1b2130; --dim:#6b7688;
    --navy:#12305c; --blue:#2f6fd0; --gold:#c8892a; --soft:#eef3fb;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    padding-bottom:24px;
  }
  button{font-family:inherit; cursor:pointer;}
  .wrap{padding:16px 16px 0; max-width:640px; margin:0 auto;}

  /* 헤더 */
  header{background:linear-gradient(160deg,#12305c 0%,#1d4c8f 100%); color:#fff; padding:18px 16px 16px;}
  header .inner{max-width:640px; margin:0 auto;}
  header h1{font-size:19px; margin:0 0 3px; letter-spacing:-0.4px;}
  header p{font-size:11.5px; margin:0; color:#bcd0ee;}
  .tools{display:flex; gap:8px; margin-top:14px;}
  .search{flex:1; position:relative;}
  .search input{
    width:100%; border:0; border-radius:11px; padding:12px 12px 12px 36px;
    font-size:14px; background:rgba(255,255,255,.14); color:#fff; font-family:inherit;
  }
  .search input::placeholder{color:#a9c0e0;}
  .search .ic{position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px; opacity:.8;}
  .fav-btn{
    border:0; border-radius:11px; padding:0 14px; background:rgba(255,255,255,.14);
    color:#fff; font-size:12.5px; font-weight:700;
  }
  .fav-btn.on{background:var(--gold); color:#fff;}

  /* 칩 */
  .chips{display:flex; gap:7px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chips button{
    flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--dim);
    border-radius:99px; padding:8px 13px; font-size:12.5px; font-weight:600;
  }
  .chips button.sel{background:var(--navy); border-color:var(--navy); color:#fff;}

  /* 목록 */
  .list{display:flex; flex-direction:column; gap:9px; margin-top:10px;}
  .item{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px;
    display:flex; gap:12px; align-items:center; text-align:left; width:100%;
  }
  .item .em{font-size:24px; width:34px; text-align:center; flex:0 0 auto;}
  .item .txt{flex:1; min-width:0;}
  .item .nm{font-size:15px; font-weight:800; letter-spacing:-0.3px; margin-bottom:3px;}
  .item .ds{font-size:12px; color:var(--dim); line-height:1.45;}
  .item .pr{font-size:11.5px; color:var(--gold); font-weight:700; margin-top:4px;}
  .item .star{font-size:17px; color:#d5dbe6; flex:0 0 auto; padding:4px;}
  .item .star.on{color:var(--gold);}
  .empty{text-align:center; color:var(--dim); font-size:13px; padding:40px 0;}

  /* 상세 */
  #detail{display:none;}
  .back{
    border:0; background:none; color:var(--navy); font-size:13.5px; font-weight:700;
    padding:14px 0 6px;
  }
  .hero{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:10px;}
  .brand{display:inline-block; font-size:10.5px; font-weight:800; color:var(--blue);
    background:var(--soft); border-radius:6px; padding:3px 8px; margin-bottom:9px;}
  .hero h2{font-size:20px; margin:0 0 6px; letter-spacing:-0.5px; line-height:1.35;}
  .hero .tag{font-size:13.5px; color:#46536a; line-height:1.6; margin:0;}
  .hero .price{margin-top:11px; font-size:12.5px; color:var(--gold); font-weight:700;}
  .hero .price span{color:var(--dim); font-weight:500;}

  .sec{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:10px;}
  .sec h3{font-size:13px; margin:0 0 11px; color:var(--navy); letter-spacing:-0.2px;}
  .sec ul{margin:0; padding:0; list-style:none;}
  .sec li{font-size:13.5px; line-height:1.65; padding-left:18px; position:relative; margin-bottom:8px; color:#2b3444;}
  .sec li:last-child{margin-bottom:0;}
  .sec li::before{content:"·"; position:absolute; left:5px; top:0; color:var(--blue); font-weight:900;}

  .script{font-size:14px; line-height:1.8; color:#2b3444; white-space:pre-line;}

  .faq{border-top:1px solid var(--line); padding:12px 0; }
  .faq:first-of-type{border-top:0; padding-top:0;}
  .faq:last-of-type{padding-bottom:0;}
  .faq .q{font-size:13.5px; font-weight:700; display:flex; gap:8px; align-items:flex-start; color:#1b2130;}
  .faq .q .mq{color:var(--blue); font-weight:900; flex:0 0 auto;}
  .faq .a{font-size:13px; line-height:1.7; color:#4a5568; margin-top:6px; padding-left:18px;}

  .actions{display:flex; gap:8px; margin:4px 0 16px;}
  .actions button{
    flex:1; border-radius:13px; padding:15px; font-size:14.5px; font-weight:800; border:1px solid var(--line);
    background:var(--card); color:var(--navy);
  }
  .actions .primary{background:var(--navy); border-color:var(--navy); color:#fff;}

  /* 발표 모드 */
  #show{
    display:none; position:fixed; inset:0; background:#0d1626; color:#fff; z-index:50;
    flex-direction:column; padding:0;
  }
  #show.on{display:flex;}
  .slide{flex:1; display:flex; flex-direction:column; justify-content:center; padding:32px 26px; overflow-y:auto;}
  .slide .kicker{font-size:13px; color:#7ea6e0; font-weight:800; margin-bottom:14px; letter-spacing:.2px;}
  .slide .big{font-size:27px; font-weight:800; line-height:1.4; letter-spacing:-0.7px;}
  .slide .big2{font-size:22px; font-weight:700; line-height:1.5; letter-spacing:-0.5px;}
  .slide .sub{font-size:17px; color:#a9bcd6; line-height:1.7; margin-top:16px;}
  .slide .pt{display:flex; gap:12px; align-items:flex-start; margin-bottom:18px;}
  .slide .pt .num{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:#2f6fd0; color:#fff;
    font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:2px;
  }
  .slide .pt .t{font-size:20px; line-height:1.55; font-weight:700; letter-spacing:-0.4px;}
  .showbar{
    display:flex; align-items:center; gap:12px; padding:14px 20px 22px; background:#0d1626;
    border-top:1px solid rgba(255,255,255,.1);
  }
  .showbar .pcount{font-size:12px; color:#7e8ea6; min-width:44px;}
  .showbar .dots{flex:1; display:flex; gap:5px;}
  .showbar .dots i{flex:1; height:4px; border-radius:99px; background:rgba(255,255,255,.18);}
  .showbar .dots i.on{background:#4d8cff;}
  .showbar button{
    border:0; border-radius:11px; padding:12px 18px; font-size:14px; font-weight:800;
    background:rgba(255,255,255,.14); color:#fff;
  }
  .showbar .nx{background:#2f6fd0;}

  /* 하단 고지 */
  .note{font-size:11px; color:#8a95a8; line-height:1.7; padding:14px 4px 4px; text-align:center;}
  .note b{color:#6b7688;}
</style>
</head>
<body>

<header>
  <div class="inner">
    <h1>암웨이 제품 설명 자료</h1>
    <p>고객 앞에서 바로 보여주고, 그대로 읽어도 되는 설명 멘트</p>
    <div class="tools">
      <div class="search">
        <span class="ic">🔍</span>
        <input id="q" type="search" placeholder="제품 이름이나 고민으로 찾기 (예: 관절, 피부)">
      </div>
      <button class="fav-btn" id="favOnly">★ 즐겨찾기</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="chips" id="chips"></div>

  <!-- 목록 -->
  <div id="listView">
    <div class="list" id="list"></div>
    <div class="empty" id="empty" style="display:none;">찾는 제품이 없어요. 다른 말로 찾아보세요.</div>
    <div class="note">
      <b>참고용 자료입니다.</b><br>
      건강기능식품의 기능성 내용은 제품 라벨과 식약처 인정 문구를 그대로 확인하세요.<br>
      가격·용량은 바뀔 수 있으니 주문 전 공식몰에서 다시 확인하세요.
    </div>
  </div>

  <!-- 상세 -->
  <div id="detail"></div>
</div>

<!-- 발표 모드 -->
<div id="show">
  <div class="slide" id="slide"></div>
  <div class="showbar">
    <div class="pcount" id="pcount">1 / 1</div>
    <div class="dots" id="dots"></div>
    <button id="prevBtn">이전</button>
    <button class="nx" id="nextBtn">다음</button>
  </div>
</div>

const BRANDS = ["전체","뉴트리라이트","아티스트리","홈케어","퍼스널케어","기타"];
let curBrand = "전체", favOnly = false, keyword = "";
let favs = [];
try{ favs = JSON.parse(localStorage.getItem("amwayFavs") || "[]"); }catch(e){ favs = []; }

const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const chipsEl = document.getElementById("chips");
const listView = document.getElementById("listView");
const detailEl = document.getElementById("detail");
const qEl = document.getElementById("q");
const favBtn = document.getElementById("favOnly");

function saveFavs(){ try{ localStorage.setItem("amwayFavs", JSON.stringify(favs)); }catch(e){} }
function isFav(id){ return favs.indexOf(id) >= 0; }

chipsEl.innerHTML = "";
BRANDS.forEach(b => {
  const btn = document.createElement("button");
  btn.textContent = b;
  if(b === "전체") btn.classList.add("sel");
  btn.addEventListener("click", () => {
    curBrand = b;
    Array.from(chipsEl.children).forEach(c => c.classList.remove("sel"));
    btn.classList.add("sel");
    renderList();
  });
  chipsEl.appendChild(btn);
});

function match(p){
  if(favOnly && !isFav(p.id)) return false;
  if(curBrand !== "전체" && p.brand !== curBrand) return false;
  if(!keyword) return true;
  const hay = (p.name + " " + p.tag + " " + p.who + " " + p.points.join(" ") + " " + p.brand).toLowerCase();
  return hay.indexOf(keyword.toLowerCase()) >= 0;
}

function renderList(){
  detailEl.style.display = "none";
  listView.style.display = "block";
  listEl.innerHTML = "";
  const rows = P.filter(match);
  emptyEl.style.display = rows.length ? "none" : "block";
  rows.forEach(p => {
    const b = document.createElement("button");
    b.className = "item";
    b.innerHTML =
      '<span class="em">' + p.em + '</span>' +
      '<span class="txt"><span class="nm">' + p.name + '</span>' +
      '<span class="ds">' + p.tag + '</span>' +
      '<span class="pr">' + p.price + '</span></span>' +
      '<span class="star' + (isFav(p.id) ? ' on' : '') + '">★</span>';
    b.addEventListener("click", e => {
      if(e.target.classList.contains("star")){
        const i = favs.indexOf(p.id);
        if(i >= 0) favs.splice(i,1); else favs.push(p.id);
        saveFavs(); renderList(); return;
      }
      openDetail(p.id);
    });
    listEl.appendChild(b);
  });
}

function openDetail(id){
  const p = P.find(x => x.id === id);
  if(!p) return;
  listView.style.display = "none";
  detailEl.style.display = "block";
  window.scrollTo(0,0);

  let html = '';
  html += '<button class="back" id="backBtn">← 목록으로</button>';
  html += '<div class="hero">';
  html += '<span class="brand">' + p.brand + '</span>';
  html += '<h2>' + p.em + ' ' + p.name + '</h2>';
  html += '<p class="tag">' + p.tag + '</p>';
  html += '<div class="price">' + p.price + ' <span>· ' + p.size + '</span></div>';
  html += '</div>';

  html += '<div class="sec"><h3>이런 분께</h3><ul><li>' + p.who + '</li></ul></div>';
  html += '<div class="sec"><h3>핵심 포인트</h3><ul>' + p.points.map(t => '<li>' + t + '</li>').join('') + '</ul></div>';
  html += '<div class="sec"><h3>사용·섭취</h3><ul><li>' + p.use + '</li></ul></div>';
  html += '<div class="sec"><h3>설명 멘트 (그대로 읽어도 됩니다)</h3><div class="script">' + p.script + '</div></div>';
  if(p.faq && p.faq.length){
    html += '<div class="sec"><h3>자주 나오는 질문</h3>' +
      p.faq.map(f => '<div class="faq"><div class="q"><span class="mq">Q</span><span>' + f.q + '</span></div><div class="a">' + f.a + '</div></div>').join('') +
      '</div>';
  }
  html += '<div class="actions">' +
    '<button class="primary" id="showBtn">고객에게 크게 보여주기</button>' +
    '<button id="favBtn2">' + (isFav(p.id) ? '★ 즐겨찾기 해제' : '☆ 즐겨찾기') + '</button>' +
    '</div>';
  html += '<div class="note"><b>참고용 자료입니다.</b> 기능성 문구·가격은 라벨과 공식몰에서 확인하세요.</div>';

  detailEl.innerHTML = html;
  document.getElementById("backBtn").addEventListener("click", renderList);
  document.getElementById("showBtn").addEventListener("click", () => startShow(p));
  document.getElementById("favBtn2").addEventListener("click", () => {
    const i = favs.indexOf(p.id);
    if(i >= 0) favs.splice(i,1); else favs.push(p.id);
    saveFavs(); openDetail(p.id);
  });
}

/* 발표 모드 */
let slides = [], sIdx = 0;
function buildSlides(p){
  const s = [];
  s.push({kicker:p.brand, big:p.name, sub:p.tag});
  s.push({kicker:"이런 분께", big2:p.who});
  p.points.forEach((t,i) => s.push({kicker:"포인트 " + (i+1), pn:String(i+1), big2:t}));
  s.push({kicker:"가격", big:p.price, sub:p.size});
  if(p.faq && p.faq.length){
    p.faq.forEach(f => s.push({kicker:"질문 나오면", big2:"Q. " + f.q, sub:"→ " + f.a}));
  }
  return s;
}
function renderSlide(){
  const s = slides[sIdx];
  const el = document.getElementById("slide");
  let h = '';
  if(s.kicker) h += '<div class="kicker">' + s.kicker + '</div>';
  if(s.pn){
    h += '<div class="pt"><span class="num">' + s.pn + '</span><span class="t">' + s.big2 + '</span></div>';
  } else if(s.big){
    h += '<div class="big">' + s.big + '</div>';
  } else if(s.big2){
    h += '<div class="big2">' + s.big2 + '</div>';
  }
  if(s.sub) h += '<div class="sub">' + s.sub + '</div>';
  el.innerHTML = h;
  document.getElementById("pcount").textContent = (sIdx+1) + " / " + slides.length;
  const dots = document.getElementById("dots");
  dots.innerHTML = '';
  slides.forEach((_,i) => {
    const d = document.createElement("i");
    if(i === sIdx) d.className = "on";
    dots.appendChild(d);
  });
  document.getElementById("prevBtn").style.visibility = sIdx === 0 ? "hidden" : "visible";
  document.getElementById("nextBtn").textContent = sIdx === slides.length - 1 ? "닫기" : "다음";
}
function startShow(p){
  slides = buildSlides(p);
  sIdx = 0;
  document.getElementById("show").classList.add("on");
  renderSlide();
}
document.getElementById("nextBtn").addEventListener("click", () => {
  if(sIdx >= slides.length - 1){ document.getElementById("show").classList.remove("on"); return; }
  sIdx++; renderSlide();
});
document.getElementById("prevBtn").addEventListener("click", () => {
  if(sIdx > 0){ sIdx--; renderSlide(); }
});
document.getElementById("slide").addEventListener("click", () => {
  if(sIdx < slides.length - 1){ sIdx++; renderSlide(); }
});

/* 검색 / 즐겨찾기 */
qEl.addEventListener("input", () => { keyword = qEl.value.trim(); renderList(); });
favBtn.addEventListener("click", () => {
  favOnly = !favOnly;
  favBtn.classList.toggle("on", favOnly);
  renderList();
});

renderList();
</script>
