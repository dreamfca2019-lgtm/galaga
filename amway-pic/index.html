<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<meta name="theme-color" content="#0b2a55">
<title>그림으로 보는 암웨이 제품 사용법</title>
<style>
  :root{
    --fs:22px;
    --ink:#101d33; --ink2:#33425c; --dim:#5a6880;
    --navy:#0b2a55; --blue:#1256b8; --sky:#eaf3ff; --line:#8fa5c3;
    --soft:#eef4fd; --gold:#8a5200; --bg:#f4f7fc; --card:#ffffff;
    --min:64px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:var(--fs); line-height:1.55; letter-spacing:-0.2px;
    padding-bottom:34px;
  }
  body.big{--fs:27px;}
  body.inDetail header{display:none;}
  button, input{font-family:inherit;}
  button{cursor:pointer;}
  button:focus-visible, input:focus-visible{outline:4px solid #ffbf47; outline-offset:3px;}

  /* ---------- 상단 ---------- */
  header{background:var(--navy); color:#fff; padding:18px 16px 20px;}
  .hin{max-width:760px; margin:0 auto;}
  header h1{font-size:1.18em; margin:0 0 4px; letter-spacing:-0.6px; line-height:1.3;}
  header .sub{margin:0 0 14px; font-size:0.78em; color:#c6d9f5; line-height:1.4;}
  .searchwrap{position:relative;}
  .searchwrap input{
    width:100%; min-height:var(--min); border:3px solid #fff; border-radius:16px;
    padding:12px 16px; font-size:0.9em; color:var(--ink); background:#fff;
  }
  .tools{display:flex; gap:10px; margin-top:12px;}
  .tools button{
    flex:1; min-height:var(--min); border-radius:14px; font-size:0.82em; font-weight:800;
    border:3px solid #8fb2e0; background:transparent; color:#fff; padding:8px;
  }
  .tools button.on{background:#fff; color:var(--navy); border-color:#fff;}

  /* ---------- 목록 ---------- */
  .wrap{max-width:760px; margin:0 auto; padding:18px 16px 0;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .card{
    display:flex; flex-direction:column; width:100%; padding:10px 10px 14px;
    background:var(--card); border:3px solid var(--line); border-radius:22px; text-align:center;
  }
  .card:active{background:var(--soft);}
  .card .pic{
    width:100%; aspect-ratio:1 / 1; border-radius:16px; background:#fff;
    display:block; object-fit:contain;
  }
  .card .nm{
    display:block; margin-top:8px; font-size:1.2em; font-weight:900; line-height:1.25;
    color:var(--navy); letter-spacing:-0.6px; word-break:keep-all;
  }
  .empty{text-align:center; color:var(--dim); padding:48px 0; font-size:0.95em;}
  .foot{
    margin:22px 0 10px; padding:14px 12px; border-radius:14px; background:#fff;
    border:2px dashed var(--line); color:var(--dim); font-size:0.72em; line-height:1.55; text-align:center;
  }

  /* ---------- 상세 ---------- */
  #detail{display:none;}
  .bar{
    position:sticky; top:0; z-index:20; display:flex; gap:10px; padding:10px 0;
    background:rgba(244,247,252,.97); border-bottom:2px solid #dbe4f0;
  }
  .bar button{
    flex:1; min-height:var(--min); border-radius:16px; font-size:0.85em; font-weight:900;
    border:3px solid var(--navy); background:#fff; color:var(--navy); padding:8px 6px;
  }
  .bar .go{background:var(--navy); color:#fff;}
  .hero{margin:8px 0 6px; text-align:center;}
  .hero img{width:100%; max-width:400px; aspect-ratio:1/1; object-fit:contain; display:block; margin:0 auto;}
  .hero .brand{
    display:inline-block; margin:2px 0 6px; padding:4px 12px; border-radius:9px;
    background:var(--sky); color:var(--blue); font-size:0.68em; font-weight:900;
  }
  .hero h2{margin:0 0 8px; font-size:1.55em; line-height:1.2; letter-spacing:-1px; color:var(--navy);}
  .what{background:#fff; border:3px solid var(--line); border-radius:18px; padding:14px 16px; margin-bottom:16px;}
  .what .k{font-size:0.68em; font-weight:900; color:var(--blue); display:block; margin-bottom:4px;}
  .what .v{margin:0; font-size:1.0em; font-weight:700; line-height:1.5;}

  /* 단계 슬라이더 */
  .steps{background:#fff; border:4px solid var(--navy); border-radius:22px; padding:14px 12px 16px; margin-bottom:16px;}
  .stepTop{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;}
  .stepTop .lab{font-size:0.72em; font-weight:900; color:var(--blue); letter-spacing:0;}
  .stepTop .cnt{font-size:0.9em; font-weight:900; color:var(--navy);}
  .stage{position:relative; display:flex; align-items:center; justify-content:center;}
  .stage .num{
    position:absolute; left:0; top:0; z-index:2; width:1.85em; height:1.85em; border-radius:50%;
    background:var(--navy); color:#fff; font-size:1.5em; font-weight:900; line-height:1.85em;
    text-align:center; box-shadow:0 2px 0 #061a35;
  }
  .stage svg{width:100%; max-width:330px; height:auto; display:block;}
  .sayStep{
    margin:12px 4px 14px; font-size:1.42em; font-weight:900; line-height:1.35;
    text-align:center; color:#0b1b33; letter-spacing:-1.2px; word-break:keep-all;
  }
  .navs{display:flex; gap:12px;}
  .navs button{
    flex:1; min-height:78px; border-radius:18px; font-size:1.0em; font-weight:900;
    border:4px solid var(--navy); background:#fff; color:var(--navy);
  }
  .navs button:disabled{opacity:.38; border-color:#9fb0c6; color:#6b7a90;}
  .navs .nx{background:var(--blue); border-color:var(--blue); color:#fff;}
  .dots{display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap;}
  .dots i{
    width:16px; height:16px; border-radius:50%; background:#c3d0e2; display:block;
  }
  .dots i.on{background:var(--navy); width:34px; border-radius:8px;}

  .sec{background:#fff; border:3px solid var(--line); border-radius:18px; padding:14px 16px; margin-bottom:14px;}
  .sec h3{margin:0 0 10px; font-size:0.86em; color:var(--blue); letter-spacing:-0.3px;}
  .sec ul{margin:0; padding:0; list-style:none;}
  .sec li{
    position:relative; padding-left:30px; margin-bottom:12px; font-size:0.92em; line-height:1.5; font-weight:600;
  }
  .sec li:last-child{margin-bottom:0;}
  .sec li::before{
    content:""; position:absolute; left:4px; top:.42em; width:16px; height:16px; border-radius:50%;
    background:#1256b8;
  }
  .qa .q{font-size:0.9em; font-weight:900; margin-bottom:6px;}
  .qa .a{font-size:0.85em; color:var(--ink2); line-height:1.5;}

  /* ---------- 크게 보여주기 ---------- */
  #show{display:none; position:fixed; inset:0; z-index:60; background:#0b1b33; color:#fff;}
  #show.on{display:flex; flex-direction:column;}
  .showTop{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; border-bottom:2px solid rgba(255,255,255,.18);}
  .showTop .pname{font-size:0.8em; font-weight:900; color:#bcd4f5; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .showTop .cnt{font-size:0.9em; font-weight:900; color:#ffd166; flex:0 0 auto;}
  .showTop button{
    min-height:60px; min-width:76px; border-radius:14px; border:3px solid #8fb2e0; background:transparent;
    color:#fff; font-size:0.85em; font-weight:900; padding:6px 12px; flex:0 0 auto;
  }
  .showBody{flex:1; display:flex; flex-direction:column; justify-content:center; padding:14px 16px 6px; overflow:auto;}
  .showCard{
    position:relative; background:#fff; border-radius:26px; padding:10px; margin:0 auto; width:100%; max-width:520px;
  }
  .showCard svg{width:100%; height:auto; display:block; max-height:52vh;}
  .showCard .num{
    position:absolute; left:10px; top:10px; width:1.6em; height:1.6em; line-height:1.6em; text-align:center;
    border-radius:50%; background:var(--navy); color:#fff; font-size:1.55em; font-weight:900;
  }
  .showSay{
    margin:16px auto 0; max-width:560px; text-align:center; font-size:1.75em; font-weight:900;
    line-height:1.3; letter-spacing:-1.4px; word-break:keep-all; color:#fff;
  }
  .showBtns{display:flex; gap:12px; padding:14px 16px 22px;}
  .showBtns button{
    flex:1; min-height:86px; border-radius:18px; border:4px solid #8fb2e0; background:rgba(255,255,255,.12);
    color:#fff; font-size:1.05em; font-weight:900;
  }
  .showBtns .nx{background:#ffd166; border-color:#ffd166; color:#0b1b33;}
  .showBtns button:disabled{opacity:.35;}

  .endmsg{margin:6px auto 0; text-align:center; font-size:0.75em; color:#9fb4d4; max-width:520px;}
</style>
</head>
<body>

<header>
  <div class="hin">
    <h1>그림으로 보는 제품 사용법</h1>
    <p class="sub">사진 대신 그림으로 한 단계씩 보여 줍니다</p>
    <div class="searchwrap">
      <input id="q" type="search" placeholder="제품 이름을 적어 주세요" aria-label="제품 이름 검색">
    </div>
    <div class="tools">
      <button id="sizeBtn" aria-pressed="false">글씨 더 크게</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="listView">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">찾는 제품이 없습니다.<br>다른 말로 적어 보세요.</div>
    <div class="foot">
      효능 문구와 가격은 제품 라벨과 공식몰에서 확인해 주세요.<br>
      그림은 제품을 알아보기 쉽게 그린 것으로 실제 모양과 다를 수 있습니다.
    </div>
  </div>
  <div id="detail"></div>
</div>

<div id="show" role="dialog" aria-label="고객에게 크게 보여주기">
  <div class="showTop">
    <button id="sClose">✕ 닫기</button>
    <span class="pname" id="sName"></span>
    <span class="cnt" id="sCnt">1 / 4</span>
  </div>
  <div class="showBody">
    <div class="showCard" id="sCard"></div>
    <div class="showSay" id="sSay"></div>
    <div class="endmsg" id="sEnd"></div>
  </div>
  <div class="showBtns">
    <button id="sPrev">◀ 이전</button>
    <button class="nx" id="sNext">다음 ▶</button>
  </div>
</div>

<script>
/* =========================================================
   1) 단계 그림(SVG) 모음 — 외부 파일 없이 직접 그린 도형
   ========================================================= */
var INK = "#33303f";
function A(fill, extra){ return 'fill="' + fill + '" stroke="' + INK + '" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" ' + (extra || ''); }
function N(fill){ return 'fill="' + fill + '" stroke="none" '; }
function LN(extra){ return 'fill="none" stroke="' + INK + '" stroke-width="7" stroke-linecap="round" ' + (extra || ''); }
function BG(c){ return '<rect x="6" y="6" width="288" height="288" rx="34" fill="' + c + '"/>'; }

function headArt(hairColor){
  var h = hairColor || "#7a5a44";
  return ''
    + '<circle cx="70" cy="158" r="15" ' + A('#f7d6bc') + '/>'
    + '<circle cx="230" cy="158" r="15" ' + A('#f7d6bc') + '/>'
    + '<ellipse cx="150" cy="152" rx="80" ry="90" ' + A('#f7d6bc') + '/>'
    + '<path d="M70 128 Q82 56 150 54 Q218 56 230 128 Q198 100 150 100 Q102 100 70 128 Z" ' + A(h) + '/>'
    + '<circle cx="122" cy="150" r="9" ' + N(INK) + '/>'
    + '<circle cx="178" cy="150" r="9" ' + N(INK) + '/>'
    + '<path d="M128 184 Q150 204 172 184" ' + LN() + '/>'
    + '<circle cx="104" cy="176" r="12" ' + N('#f6b3b3') + '/>'
    + '<circle cx="196" cy="176" r="12" ' + N('#f6b3b3') + '/>';
}
function glassArt(fillColor, topY){
  var t = topY || 150;
  var lx = 106 + 10 * ((t - 96) / 154), rx = 194 - 10 * ((t - 96) / 154);
  return ''
    + '<path d="M106 96 H194 L184 252 Q150 262 116 252 Z" ' + A('#f4fbff') + '/>'
    + '<path d="M' + lx.toFixed(1) + ' ' + t + ' H' + rx.toFixed(1) + ' L184 252 Q150 262 116 252 Z" ' + N(fillColor) + '/>'
    + '<ellipse cx="150" cy="96" rx="44" ry="10" ' + A('#e6f5ff') + '/>';
}
function clockArt(cx, cy, r, hAng, mAng, face){
  var s = '';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" ' + A(face || '#ffffff') + '/>';
  for (var i = 0; i < 12; i++){
    var a = i * Math.PI / 6, r1 = r - 12, r2 = r - (i % 3 === 0 ? 26 : 20);
    s += '<line x1="' + (cx + r1 * Math.sin(a)).toFixed(1) + '" y1="' + (cy - r1 * Math.cos(a)).toFixed(1)
      + '" x2="' + (cx + r2 * Math.sin(a)).toFixed(1) + '" y2="' + (cy - r2 * Math.cos(a)).toFixed(1)
      + '" stroke="' + INK + '" stroke-width="' + (i % 3 === 0 ? 7 : 4) + '" stroke-linecap="round"/>';
  }
  var ha = hAng * Math.PI / 180, ma = mAng * Math.PI / 180;
  s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + r * 0.45 * Math.sin(ha)).toFixed(1) + '" y2="' + (cy - r * 0.45 * Math.cos(ha)).toFixed(1) + '" stroke="' + INK + '" stroke-width="11" stroke-linecap="round"/>';
  s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + r * 0.68 * Math.sin(ma)).toFixed(1) + '" y2="' + (cy - r * 0.68 * Math.cos(ma)).toFixed(1) + '" stroke="' + INK + '" stroke-width="8" stroke-linecap="round"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="9" ' + N(INK) + '/>';
  return s;
}
function sunArt(cx, cy, r){
  var s = '';
  for (var i = 0; i < 8; i++){
    var a = i * Math.PI / 4;
    s += '<line x1="' + (cx + (r + 16) * Math.sin(a)).toFixed(1) + '" y1="' + (cy - (r + 16) * Math.cos(a)).toFixed(1)
      + '" x2="' + (cx + (r + 34) * Math.sin(a)).toFixed(1) + '" y2="' + (cy - (r + 34) * Math.cos(a)).toFixed(1)
      + '" stroke="' + INK + '" stroke-width="7" stroke-linecap="round"/>';
  }
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" ' + A('#ffcd4d') + '/>';
  return s;
}
function moonArt(cx, cy, r){
  return '<path d="M' + (cx + r * 0.35) + ' ' + (cy - r) + ' A' + r + ' ' + r + ' 0 1 0 ' + (cx + r * 0.35) + ' ' + (cy + r)
    + ' A' + (r * 0.78) + ' ' + (r * 0.78) + ' 0 1 1 ' + (cx + r * 0.35) + ' ' + (cy - r) + ' Z" ' + A('#ffe9a8') + '/>';
}
function tabletArt(cx, cy, r, color){
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" ' + A(color || '#ffffff') + '/>'
    + '<line x1="' + (cx - r * 0.55) + '" y1="' + cy + '" x2="' + (cx + r * 0.55) + '" y2="' + cy + '" stroke="#9aa7b8" stroke-width="5" stroke-linecap="round"/>';
}
function capsuleArt(cx, cy, rot, c1, c2){
  return '<g transform="rotate(' + rot + ' ' + cx + ' ' + cy + ')">'
    + '<rect x="' + (cx - 34) + '" y="' + (cy - 17) + '" width="34" height="34" rx="17" ' + A(c1 || '#ffd15c') + '/>'
    + '<rect x="' + cx + '" y="' + (cy - 17) + '" width="34" height="34" rx="17" ' + A(c2 || '#ffe9a8') + '/>'
    + '</g>';
}
function arrowDown(cx, y1, y2, color){
  return '<path d="M' + cx + ' ' + y1 + ' V' + y2 + ' M' + (cx - 16) + ' ' + (y2 - 20) + ' L' + cx + ' ' + y2 + ' L' + (cx + 16) + ' ' + (y2 - 20)
    + '" fill="none" stroke="' + (color || INK) + '" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>';
}
function dropArt(cx, cy, s, color){
  return '<path d="M' + cx + ' ' + (cy - s) + ' Q' + (cx + s) + ' ' + (cy + s * 0.3) + ' ' + cx + ' ' + (cy + s * 0.7)
    + ' Q' + (cx - s) + ' ' + (cy + s * 0.3) + ' ' + cx + ' ' + (cy - s) + ' Z" ' + A(color || '#7fc8f0') + '/>';
}
function bubbles(pts){
  var s = '';
  pts.forEach(function(p){ s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + p[2] + '" ' + A('#ffffff') + '/>'; });
  return s;
}

var SC = {
  morning: function(){
    return BG('#fdf1d6')
      + '<line x1="34" y1="232" x2="266" y2="232" stroke="' + INK + '" stroke-width="9" stroke-linecap="round"/>'
      + '<path d="M88 232 A62 62 0 0 1 212 232 Z" ' + A('#ffcd4d') + '/>'
      + '<line x1="150" y1="158" x2="150" y2="128" stroke="' + INK + '" stroke-width="8" stroke-linecap="round"/>'
      + '<line x1="108" y1="168" x2="92" y2="146" stroke="' + INK + '" stroke-width="8" stroke-linecap="round"/>'
      + '<line x1="192" y1="168" x2="208" y2="146" stroke="' + INK + '" stroke-width="8" stroke-linecap="round"/>'
      + '<line x1="94" y1="190" x2="72" y2="178" stroke="' + INK + '" stroke-width="8" stroke-linecap="round"/>'
      + '<line x1="206" y1="190" x2="228" y2="178" stroke="' + INK + '" stroke-width="8" stroke-linecap="round"/>'
      + '<ellipse cx="62" cy="72" rx="26" ry="16" ' + A('#ffffff','stroke-width="5"') + '/>'
      + '<ellipse cx="88" cy="66" rx="18" ry="12" ' + A('#ffffff','stroke-width="5"') + '/>'
      + '<ellipse cx="238" cy="92" rx="24" ry="15" ' + A('#ffffff','stroke-width="5"') + '/>'
      + '<ellipse cx="216" cy="86" rx="16" ry="11" ' + A('#ffffff','stroke-width="5"') + '/>';
  },
  cupWater: function(){ return BG('#e3f2ff') + glassArt('#8fd0f5', 150) + bubbles([[150,190,9],[138,215,6],[162,220,7]]); },
  cupPill: function(){
    return BG('#eef7ff') + glassArt('#8fd0f5', 176)
      + capsuleArt(120, 92, -18, '#ffd15c', '#fff0bd') + capsuleArt(178, 92, 20, '#ffd15c', '#fff0bd')
      + arrowDown(150, 116, 152);
  },
  packet: function(){
    return BG('#eef8e6')
      + '<rect x="84" y="66" width="132" height="176" rx="14" ' + A('#fff8e8') + '/>'
      + '<path d="M84 96 H216" ' + LN() + '/>'
      + '<path d="M170 66 L216 66 L216 112 Z" ' + A('#f3e4c4') + '/>'
      + '<circle cx="150" cy="164" r="34" ' + A('#bfe3a4') + '/>'
      + '<path d="M150 184 Q148 156 168 144" ' + LN() + '/>'
      + '<path d="M150 168 Q132 160 132 148" ' + LN() + '/>'
      + capsuleArt(226, 232, -30, '#ffd15c', '#fff0bd');
  },
  clockDay: function(){ return BG('#eaf3ff') + clockArt(148, 156, 84, 240, 0) + sunArt(240, 66, 26); },
  plateMeal: function(){
    return BG('#fdf1e0')
      + '<ellipse cx="150" cy="180" rx="106" ry="64" ' + A('#ffffff') + '/>'
      + '<ellipse cx="150" cy="180" rx="80" ry="46" ' + LN('stroke-width="5"') + '/>'
      + '<path d="M110 176 Q112 138 150 138 Q188 138 190 176 Z" ' + A('#fffaf0') + '/>'
      + '<circle cx="116" cy="196" r="16" ' + A('#a8d98b') + '/>'
      + '<circle cx="186" cy="196" r="16" ' + A('#f6b3b3') + '/>'
      + '<line x1="230" y1="96" x2="282" y2="182" stroke="' + INK + '" stroke-width="9" stroke-linecap="round"/>'
      + '<line x1="252" y1="86" x2="292" y2="168" stroke="' + INK + '" stroke-width="9" stroke-linecap="round"/>';
  },
  pills: function(){
    return BG('#eef7e6')
      + tabletArt(94, 128, 34, '#ffffff')
      + tabletArt(152, 112, 28, '#ffffff')
      + tabletArt(206, 132, 32, '#fff4d6')
      + capsuleArt(140, 212, -10, '#ffd15c', '#fff0bd')
      + capsuleArt(214, 228, 16, '#ffd15c', '#fff0bd');
  },
  doctor: function(){
    return BG('#eaf3ff')
      + '<path d="M42 88 h120 a18 18 0 0 1 18 18 v54 a18 18 0 0 1 -18 18 h-74 l-28 26 v-26 h-18 a18 18 0 0 1 -18 -18 v-54 a18 18 0 0 1 18 -18 Z" ' + A('#ffffff') + '/>'
      + '<rect x="86" y="118" width="14" height="44" ' + A('#e8695f','stroke-width="5"') + '/>'
      + '<rect x="71" y="133" width="44" height="14" ' + A('#e8695f','stroke-width="5"') + '/>'
      + '<path d="M180 168 h84 a16 16 0 0 0 16 -16 v-38 a16 16 0 0 0 -16 -16 h-52" ' + A('#dcecff') + '/>'
      + '<circle cx="204" cy="150" r="8" ' + N(INK) + '/>'

var gridEl   = document.getElementById('grid');
var emptyEl  = document.getElementById('empty');
var listView = document.getElementById('listView');
var detailEl = document.getElementById('detail');
var qEl      = document.getElementById('q');
var sizeBtn  = document.getElementById('sizeBtn');
var showEl   = document.getElementById('show');
var sCard    = document.getElementById('sCard');
var sSay     = document.getElementById('sSay');
var sCnt     = document.getElementById('sCnt');
var sName    = document.getElementById('sName');
var sNext    = document.getElementById('sNext');
var sPrev    = document.getElementById('sPrev');

var cur = null, si = 0, hi = 0, kw = '';

function esc(s){
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function findP(id){
  for (var i = 0; i < P.length; i++){ if (P[i].id === id) return P[i]; }
  return null;
}
function matches(p){
  if (!kw) return true;
  var hay = (p.name + ' ' + p.brand + ' ' + p.one + ' ' + p.keep.join(' ') + ' ' +
    p.steps.map(function(s){ return s[0]; }).join(' ')).toLowerCase();
  return hay.indexOf(kw.toLowerCase()) >= 0;
}

/* ---------- 목록 ---------- */
function renderList(){
  var rows = P.filter(matches), h = '';
  rows.forEach(function(p){
    h += '<button class="card" data-id="' + p.id + '">'
      + '<img class="pic" src="' + p.img + '" alt="' + esc(p.name) + ' 그림" loading="lazy">'
      + '<span class="nm">' + esc(p.name) + '</span>'
      + '</button>';
  });
  gridEl.innerHTML = h;
  emptyEl.style.display = rows.length ? 'none' : 'block';
}
gridEl.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('.card') : null;
  if (b) openDetail(b.getAttribute('data-id'));
});

/* ---------- 상세 ---------- */
function openDetail(id){
  var p = findP(id);
  if (!p) return;
  cur = p; si = 0;
  listView.style.display = 'none';
  detailEl.style.display = 'block';
  document.body.classList.add('inDetail');

  var h = '';
  h += '<div class="bar">'
     + '<button id="backBtn">← 목록으로</button>'
     + '<button id="showBtn" class="go">크게 보여주기</button>'
     + '</div>';
  h += '<div class="hero">';
  h += '<img src="' + p.img + '" alt="' + esc(p.name) + ' 그림">';
  h += '<div><span class="brand">' + esc(p.brand) + '</span></div>';
  h += '<h2>' + esc(p.name) + '</h2>';
  h += '</div>';
  h += '<div class="what"><span class="k">이게 뭐예요?</span><p class="v">' + esc(p.one) + '</p></div>';
  h += '<div class="steps">'
     + '<div class="stepTop"><span class="lab">그림으로 보는 사용법</span><span class="cnt" id="stepCnt"></span></div>'
     + '<div class="stage" id="stage"><div class="num" id="stepNum" aria-hidden="true">1</div><div id="art"></div></div>'
     + '<div class="sayStep" id="say"></div>'
     + '<div class="navs"><button id="prevBtn">◀ 이전</button><button id="nextBtn" class="nx">다음 ▶</button></div>'
     + '<div class="dots" id="dots"></div>'
     + '</div>';
  h += '<div class="sec"><h3>꼭 지켜 주세요</h3><ul>'
     + p.keep.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('')
     + '</ul></div>';
  h += '<div class="sec"><h3>고객이 물으면</h3><div class="qa"><div class="q">Q. ' + esc(p.faq.q) + '</div>'
     + '<div class="a">' + esc(p.faq.a) + '</div></div></div>';
  h += '<div class="foot">효능 문구와 가격은 제품 라벨과 공식몰에서 확인해 주세요.<br>그림은 제품을 알아보기 쉽게 그린 것으로 실제 모양과 다를 수 있습니다.</div>';

  detailEl.innerHTML = h;

  document.getElementById('backBtn').addEventListener('click', backToList);
  document.getElementById('showBtn').addEventListener('click', openShow);
  document.getElementById('prevBtn').addEventListener('click', function(){ setStep(si - 1); });
  document.getElementById('nextBtn').addEventListener('click', function(){
    setStep(si === p.steps.length - 1 ? 0 : si + 1);
  });
  document.getElementById('dots').addEventListener('click', function(e){
    var d = e.target.getAttribute && e.target.getAttribute('data-i');
    if (d !== null && d !== undefined) setStep(parseInt(d, 10));
  });
  swipe(document.getElementById('stage'), function(){ setStep(si + 1 > p.steps.length - 1 ? 0 : si + 1); }, function(){ setStep(si - 1); });

  setStep(0);
  window.scrollTo(0, 0);
  if (location.hash !== '#' + id){
    try { history.replaceState(null, '', '#' + id); } catch (e) { location.hash = id; }
  }
}
function setStep(i){
  if (!cur) return;
  var last = cur.steps.length - 1;
  si = i < 0 ? 0 : (i > last ? last : i);
  var st = cur.steps[si], art = SC[st[1]] || SC.morning;
  document.getElementById('art').innerHTML =
    '<svg viewBox="0 0 300 300" role="img" aria-label="' + esc(st[0]) + '">' + art() + '</svg>';
  document.getElementById('stepNum').textContent = si + 1;
  document.getElementById('stepCnt').textContent = (si + 1) + ' / ' + cur.steps.length + ' 단계';
  document.getElementById('say').textContent = st[0];
  document.getElementById('prevBtn').disabled = si === 0;
  document.getElementById('nextBtn').textContent = si === last ? '처음으로 ↺' : '다음 ▶';
  var dots = '';
  for (var d = 0; d <= last; d++){
    dots += '<i data-i="' + d + '" class="' + (d === si ? 'on' : '') + '" style="cursor:pointer"></i>';
  }
  document.getElementById('dots').innerHTML = dots;
}
function backToList(){
  cur = null;
  detailEl.style.display = 'none';
  detailEl.innerHTML = '';
  document.body.classList.remove('inDetail');
  listView.style.display = 'block';
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  window.scrollTo(0, 0);
}

/* ---------- 크게 보여주기 ---------- */
function openShow(){
  if (!cur) return;
  hi = 0;
  sName.textContent = cur.name + ' · 사용법';
  showEl.classList.add('on');
  renderShow();
  if (document.documentElement.requestFullscreen){
    var rq = document.documentElement.requestFullscreen();
    if (rq && rq.catch) rq.catch(function(){});
  }
}
function renderShow(){
  var st = cur.steps[hi], last = cur.steps.length - 1;
  sCard.innerHTML = '<div class="num" aria-hidden="true">' + (hi + 1) + '</div>'
    + '<svg viewBox="0 0 300 300" role="img" aria-label="' + esc(st[0]) + '">' + (SC[st[1]] || SC.morning)() + '</svg>';
  sSay.textContent = st[0];
  sCnt.textContent = (hi + 1) + ' / ' + (last + 1);
  sPrev.disabled = hi === 0;
  sNext.textContent = hi === last ? '처음으로 ↺' : '다음 ▶';
}
function closeShow(){
  showEl.classList.remove('on');
  if (document.fullscreenElement && document.exitFullscreen){
    var ex = document.exitFullscreen();
    if (ex && ex.catch) ex.catch(function(){});
  }
}
sNext.addEventListener('click', function(){
  hi = hi >= cur.steps.length - 1 ? 0 : hi + 1; renderShow();
});
sPrev.addEventListener('click', function(){ if (hi > 0){ hi--; renderShow(); } });
document.getElementById('sClose').addEventListener('click', closeShow);
swipe(document.getElementById('show'), function(){
  hi = hi >= cur.steps.length - 1 ? 0 : hi + 1; renderShow();
}, function(){ if (hi > 0){ hi--; renderShow(); } });
sCard.addEventListener('click', function(){
  hi = hi >= cur.steps.length - 1 ? 0 : hi + 1; renderShow();
});

function swipe(el, onLeft, onRight){
  var x0 = null, y0 = null;
  el.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0]; x0 = t.clientX; y0 = t.clientY;
  }, { passive: true });
  el.addEventListener('touchend', function(e){
    if (x0 === null) return;
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)){ (dx < 0 ? onLeft : onRight)(); }
  }, { passive: true });
}

/* ---------- 검색 · 글씨 크기 · 키보드 ---------- */
qEl.addEventListener('input', function(){ kw = qEl.value.trim(); renderList(); });
sizeBtn.addEventListener('click', function(){
  var big = document.body.classList.toggle('big');
  sizeBtn.classList.toggle('on', big);
  sizeBtn.setAttribute('aria-pressed', big ? 'true' : 'false');
  sizeBtn.textContent = big ? '글씨 원래대로' : '글씨 더 크게';
  try { localStorage.setItem('amwayPicBig', big ? '1' : '0'); } catch (e) {}
});
try {
  if (localStorage.getItem('amwayPicBig') === '1'){
    document.body.classList.add('big');
    sizeBtn.classList.add('on');
    sizeBtn.textContent = '글씨 원래대로';
  }
} catch (e) {}

document.addEventListener('keydown', function(e){
  if (showEl.classList.contains('on')){
    if (e.key === 'ArrowRight'){ e.preventDefault(); sNext.click(); }
    if (e.key === 'ArrowLeft'){ e.preventDefault(); sPrev.click(); }
    if (e.key === 'Escape'){ closeShow(); }
  } else if (cur){
    if (e.key === 'ArrowRight'){ setStep(si + 1); }
    if (e.key === 'ArrowLeft'){ setStep(si - 1); }
  }
});

/* ---------- 첫 화면 / 주소로 바로 열기 ---------- */
renderList();
(function(){
  var id = location.hash.replace('#', '');
  if (id && findP(id)) openDetail(id);
})();
</script>
